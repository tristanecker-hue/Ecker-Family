name: Push-Worker veröffentlichen
on:
  push:
    branches: [main]
    paths: ['cloudflare/worker.js', '.github/workflows/worker-deploy.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Konto und KV-Namespace suchen, wrangler.toml schreiben
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Secret CLOUDFLARE_API_TOKEN fehlt"; exit 1; }
          RAW=$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -s '[:space:]"'"'"'' ' ')
          TOK=$(printf %s "$RAW" | grep -oE 'Bearer [A-Za-z0-9_-]+' | head -1 | awk '{print $2}')
          [ -n "$TOK" ] || TOK=$(printf %s "$RAW" | tr -d ' ')
          echo "::add-mask::$TOK"
          echo "Token-Länge: ${#TOK}"
          echo "CLOUDFLARE_API_TOKEN=$TOK" >> "$GITHUB_ENV"
          CLOUDFLARE_API_TOKEN="$TOK"
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          R=$(curl -s -H "$H" https://api.cloudflare.com/client/v4/accounts)
          echo "Konten: $(echo "$R" | jq -c '[.result[]?|.name], [.errors[]?.message]')"
          ACC=$(echo "$R" | jq -r '.result[0].id // empty')
          if [ -z "$ACC" ]; then
            R3=$(curl -s -H "$H" https://api.cloudflare.com/client/v4/memberships)
            echo "Mitgliedschaften: $(echo "$R3" | jq -c '[.result[]?|.account.name], [.errors[]?.message]')"
            ACC=$(echo "$R3" | jq -r '.result[0].account.id // empty')
          fi
          R2=$(curl -s -H "$H" "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces?per_page=100")
          echo "KV: $(echo "$R2" | jq -c '[.result[]?|.title], [.errors[]?.message]')"
          KV=$(echo "$R2" | jq -r '[.result[]?|select(.title=="ecker-push-kv")][0].id // empty')
          if [ -z "$KV" ]; then KV=$(echo "$R2" | jq -r '[.result[]?][0].id // empty'); fi
          test -n "$ACC" -a -n "$KV" || { echo "Konto oder KV nicht gefunden"; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"
          cat > cloudflare/wrangler.toml <<TOML
          name = "ecker-push"
          main = "worker.js"
          compatibility_date = "2024-11-01"
          workers_dev = true
          [[kv_namespaces]]
          binding = "KV"
          id = "$KV"
          [triggers]
          crons = ["*/5 * * * *"]
          TOML
          sed -i 's/^ *//' cloudflare/wrangler.toml
      - name: Worker veröffentlichen
        working-directory: cloudflare
        env:
          HUE_CLIENT_ID: ${{ secrets.HUE_CLIENT_ID }}
          HUE_CLIENT_SECRET: ${{ secrets.HUE_CLIENT_SECRET }}
        run: |
          npx --yes wrangler@3 deploy
          if [ -n "$HUE_CLIENT_ID" ] && [ -n "$HUE_CLIENT_SECRET" ]; then
            printf %s "$HUE_CLIENT_ID" | tr -d '[:space:]' | npx --yes wrangler@3 secret put HUE_CLIENT_ID
            printf %s "$HUE_CLIENT_SECRET" | tr -d '[:space:]' | npx --yes wrangler@3 secret put HUE_CLIENT_SECRET
          else
            echo "Hue-Secrets nicht gesetzt - Hue bleibt aus"
          fi
