name: Push-Worker veröffentlichen
on:
  push:
    branches: [main]
    paths: ['cloudflare/worker.js', '.github/workflows/worker-deploy.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Konto und KV-Namespace suchen, wrangler.toml schreiben
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Secret CLOUDFLARE_API_TOKEN fehlt"; exit 1; }
          ACC=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          KV=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces?per_page=100" | jq -r '.result[] | select(.title=="ecker-push-kv") | .id')
          test -n "$ACC" -a -n "$KV" || { echo "Konto oder KV nicht gefunden"; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"
          cat > cloudflare/wrangler.toml <<TOML
          name = "ecker-push"
          main = "worker.js"
          compatibility_date = "2024-11-01"
          workers_dev = true
          [[kv_namespaces]]
          binding = "KV"
          id = "$KV"
          [triggers]
          crons = ["*/5 * * * *"]
          TOML
          sed -i 's/^ *//' cloudflare/wrangler.toml
      - name: Worker veröffentlichen
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@3 deploy
